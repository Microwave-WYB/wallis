[tools]
gleam = "1.19.2"
node = "26.13.0"

[tasks.install]
description = "Install npm dependencies (exact pins, from the lockfile)"
run = "npm ci --no-fund --no-audit"

[tasks."build:core"]
description = "Build the Gleam core and copy its JavaScript to core/dist (committed: installs never need Gleam)"
run = ["cd core && gleam build", "node tools/build-core.mjs"]

[tasks.build]
description = "Build the core, then the package's dist/ (what npm and git installs run)"
depends = ["build:core"]
run = "npx tsc -p tsconfig.build.json"

[tasks."test:core"]
description = "Core event-replay tests (gleeunit)"
dir = "core"
run = "gleam test"

[tasks."test:package"]
description = "Package tests: runtime, sandbox, agents (scripted), examples, skill, packaging; differential check on"
depends = ["build"]
run = "node --test 'test/*.test.ts'"
env = { WALLIS_DIFFERENTIAL = "1" }

[tasks.test]
description = "All tests"
depends = ["test:core", "test:package"]

[tasks.typecheck]
description = "Type-check src/, test/, examples/ and the skill's starter (examples' @ts-expect-error lines must keep failing)"
depends = ["build:core"]
run = "npx tsc --noEmit -p ."

[tasks."skill:validate"]
description = "Validate the agent skill with the Agent Skills reference validator, and list it as `npx skills add` would"
run = ["uvx --from skills-ref agentskills validate skills/wallis", "npx -y skills add . --list"]
