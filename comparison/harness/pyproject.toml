[project]
name = "wallis-comparison-harness"
version = "0.1.0"
description = "Shared fixed harness for the digits model-search comparison"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "scikit-learn",
    "numpy",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
